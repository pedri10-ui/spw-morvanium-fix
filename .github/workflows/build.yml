name: Build SPMOD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Collect SPMOD
        run: |
          gradle build
          API_JAR=$(find ~/.gradle/caches -name "*spw-workshop-api*.jar" | head -n 1)
          echo "=== API JAR: $API_JAR ==="
          jar tf "$API_JAR" | grep "com/xuncorp/spw/workshop/api"
          javap -cp "$API_JAR" $(jar tf "$API_JAR" | grep "com/xuncorp/spw/workshop/api/.*\.class$" | sed 's/\.class$//;s/\//./g')
          mkdir -p dist
          find . -type f \( -name "*.spmod" -o -name "*.jar" \) ! -path "./.gradle/*" -exec cp {} dist/ \;

      - name: Upload SPMOD Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spw-morvanium-fix
          path: dist/
