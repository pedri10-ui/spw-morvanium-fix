name: Build SPMOD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect WorkshopApi Playback
        run: |
          gradle dependencies --configuration compileClasspath > /dev/null
          API_JAR=$(find ~/.gradle/caches -name "spw-workshop-api-0.1.0-dev22.jar" | head -n 1)
          javap -cp "$API_JAR" \
            'com.xuncorp.spw.workshop.api.WorkshopApi$Playback' \
            'com.xuncorp.spw.workshop.api.PlaybackExtensionPoint$State' \
            'com.xuncorp.spw.workshop.api.PlaybackExtensionPoint$MediaItem'
