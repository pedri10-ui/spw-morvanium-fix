name: Build SPMOD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Collect SPMOD
        run: |
          gradle tasks --all | grep -i spmod || true
          gradle build
          mkdir -p dist
          find . -type f \( -name "*.spmod" -o -name "*.jar" \) ! -path "./.gradle/*" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload SPMOD Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spw-morvanium-fix
          path: dist/
