name: Build SPMOD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Package SPMOD
        run: |
          gradle tasks --group="spw" || gradle tasks
          gradle build
          gradle spmod 2>/dev/null || gradle packageSpmod 2>/dev/null || true
          find build -type f

      - name: Upload SPMOD Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spw-morvanium-fix
          path: |
            build/**/*.spmod
            build/libs/*.jar
