name: Build SPMOD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Collect SPMOD
        run: |
          gradle build
          API_JAR=$(find ~/.gradle/caches -name "*spw-workshop-api*.jar" | head -n 1)
          javap -cp "$API_JAR" \
            "com.xuncorp.spw.workshop.api.PlaybackExtensionPoint" \
            "com.xuncorp.spw.workshop.api.PlaybackExtensionPoint\$MediaItem" \
            "com.xuncorp.spw.workshop.api.PlaybackExtensionPoint\$State" \
            "com.xuncorp.spw.workshop.api.WorkshopApi" \
            "com.xuncorp.spw.workshop.api.WorkshopApi\$Playback"

      - name: Upload SPMOD Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spw-morvanium-fix
          path: dist/
